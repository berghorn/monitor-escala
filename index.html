<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Monitor CIOPS - PDF Local</title>
    <!-- Bibliotecas Necessárias -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { background: #020617; color: #f8fafc; font-family: sans-serif; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .upload-box { background: #0f172a; border: 2px dashed #334155; padding: 30px; border-radius: 12px; text-align: center; }
        .progress-container { margin: 20px 0; display: none; }
        .bar { width: 100%; bg: #1e293b; height: 12px; border-radius: 6px; background: #1e293b; overflow: hidden; }
        .fill { background: #38bdf8; height: 100%; width: 0%; transition: 0.2s; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: #1e293b; padding: 15px; border-radius: 10px; border-top: 4px solid #38bdf8; }
        .cia-name { color: #38bdf8; font-weight: bold; font-size: 1.1rem; border-bottom: 1px solid #334155; margin-bottom: 10px; padding-bottom: 5px; }
        .line { font-size: 0.85rem; padding: 3px 0; color: #cbd5e1; border-bottom: 1px solid #0f172a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Monitor de Escalas (PDF)</h1>
        <div class="upload-box">
            <p>Selecione a escala em <b>PDF</b> ou <b>Imagem</b></p>
            <input type="file" id="fileInput" accept="application/pdf,image/*">
            <div class="progress-container" id="pContainer">
                <div id="statusTxt">Processando...</div>
                <div class="bar"><div class="fill" id="pFill"></div></div>
            </div>
        </div>
        <div id="output" class="grid"></div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const fileInput = document.getElementById('fileInput');
        const pFill = document.getElementById('pFill');
        const statusTxt = document.getElementById('statusTxt');
        const pContainer = document.getElementById('pContainer');
        const output = document.getElementById('output');

        fileInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            pContainer.style.display = 'block';
            output.innerHTML = '';
            statusTxt.innerText = "Preparando documento...";

            try {
                let imageData;

                if (file.type === "application/pdf") {
                    statusTxt.innerText = "Convertendo PDF para imagem...";
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                    const page = await pdf.getPage(1); // Lendo a primeira página
                    const viewport = page.getViewport({ scale: 2.0 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    imageData = canvas.toDataURL('image/png');
                } else {
                    imageData = file;
                }

                statusTxt.innerText = "Iniciando leitura de texto (OCR)...";
                const worker = await Tesseract.createWorker('por', 1, {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            const p = Math.round(m.progress * 100);
                            pFill.style.width = p + '%';
                            statusTxt.innerText = `Lendo Escala: ${p}%`;
                        }
                    }
                });

                const { data: { text } } = await worker.recognize(imageData);
                await worker.terminate();

                // Lógica de Organização por CIA
                const lines = text.split('\n');
                let groups = {};
                let currentGroup = "GERAL / CABEÇALHO";

                lines.forEach(line => {
                    const txt = line.trim();
                    if (txt.length < 5) return;

                    const ciaMatch = txt.match(/(\d+)\s?(ª|°|a|o)\s?CIA/i);
                    if (ciaMatch) currentGroup = ciaMatch[0].toUpperCase();

                    if (!groups[currentGroup]) groups[currentGroup] = [];
                    groups[currentGroup].push(txt);
                });

                // Renderizar
                for (let cia in groups) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `<div class="cia-name">${cia}</div>`;
                    groups[cia].forEach(item => {
                        card.innerHTML += `<div class="line">${item}</div>`;
                    });
                    output.appendChild(card);
                }
                pContainer.style.display = 'none';

            } catch (err) {
                alert("Erro: " + err.message);
                console.error(err);
            }
        };
    </script>
</body>
</html>
