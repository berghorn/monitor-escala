<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Monitor CIOPS - Local</title>
    <!-- Bibliotecas Diretas -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { background: #020617; color: #f8fafc; font-family: -apple-system, sans-serif; padding: 40px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { border-bottom: 2px solid #1e293b; padding-bottom: 20px; margin-bottom: 30px; }
        .upload-area { background: #0f172a; border: 2px dashed #334155; padding: 40px; border-radius: 15px; text-align: center; }
        .btn-upload { background: #38bdf8; color: #020617; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .progress-bar { width: 100%; bg: #1e293b; height: 10px; border-radius: 5px; margin-top: 20px; display: none; }
        .progress-fill { background: #38bdf8; height: 100%; width: 0%; border-radius: 5px; transition: 0.3s; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 40px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; border-top: 4px solid #38bdf8; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        .cia-title { color: #38bdf8; font-size: 1.2rem; font-weight: 800; margin-bottom: 15px; text-transform: uppercase; }
        .item { font-size: 0.9rem; padding: 5px 0; border-bottom: 1px solid #334155; color: #cbd5e1; }
        #error-msg { color: #f87171; background: #450a0a; padding: 10px; border-radius: 5px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 style="margin:0">Monitor de Escalas Local</h1>
            <p style="color:#64748b">Organização por CIA • 100% Offline e Seguro</p>
        </div>

        <div class="upload-area" id="dropZone">
            <p>Selecione a imagem da escala (JPG ou PNG)</p>
            <input type="file" id="fileInput" accept="image/*" style="display:none">
            <button class="btn-upload" onclick="document.getElementById('fileInput').click()">ESCOLHER ARQUIVO</button>
            <div id="error-msg"></div>
            
            <div class="progress-bar" id="pBar">
                <div class="progress-fill" id="pFill"></div>
            </div>
            <p id="pText" style="margin-top:10px; font-size: 0.8rem; color:#38bdf8"></p>
        </div>

        <div id="output" class="grid"></div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const output = document.getElementById('output');
        const errorMsg = document.getElementById('error-msg');
        const pBar = document.getElementById('pBar');
        const pFill = document.getElementById('pFill');
        const pText = document.getElementById('pText');

        fileInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Reset
            errorMsg.style.display = 'none';
            output.innerHTML = '';
            pBar.style.display = 'block';
            pText.innerText = "Iniciando motor de OCR...";

            try {
                // OCR via Tesseract.js
                const worker = await Tesseract.createWorker('por', 1, {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            const p = Math.round(m.progress * 100);
                            pFill.style.width = p + '%';
                            pText.innerText = `Lendo Escala: ${p}%`;
                        }
                    }
                });

                const { data: { text } } = await worker.recognize(file);
                await worker.terminate();
                
                if (!text || text.trim().length < 10) {
                    throw new Error("Não foi possível ler texto na imagem. Verifique a nitidez.");
                }

                pBar.style.display = 'none';
                pText.innerText = "Processamento concluído!";

                // Organização Lógica por CIA (Mantendo a Ordem)
                const lines = text.split('\n');
                let groups = {};
                let currentGroup = "GERAL / OUTROS";

                lines.forEach(line => {
                    const txt = line.trim();
                    if (txt.length < 5) return;

                    // Identifica o título da CIA
                    if (txt.match(/(\d+)\s?(ª|°|a|o)\s?CIA/i)) {
                        currentGroup = txt.toUpperCase();
                    }

                    if (!groups[currentGroup]) groups[currentGroup] = [];
                    groups[currentGroup].push(txt);
                });

                // Renderiza na tela
                for (let cia in groups) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `<div class="cia-title">${cia}</div>`;
                    
                    groups[cia].forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'item';
                        div.innerText = item;
                        card.appendChild(div);
                    });
                    output.appendChild(card);
                }

            } catch (err) {
                errorMsg.innerText = "ERRO: " + err.message;
                errorMsg.style.display = 'block';
                pBar.style.display = 'none';
                pText.innerText = "";
                console.error(err);
            }
        };
    </script>
</body>
</html>
