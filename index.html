<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Monitor CIOPS - Local</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [schedules, setSchedules] = useState([]);
            const [loading, setLoading] = useState(false);
            const [progress, setProgress] = useState(0);

            useEffect(() => {
                const saved = localStorage.getItem('ciops_data_final');
                if (saved) setSchedules(JSON.parse(saved));
            }, []);

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setLoading(true);
                
                const worker = await Tesseract.createWorker('por', 1, {
                    logger: m => { if(m.status === 'recognizing text') setProgress(Math.round(m.progress * 100)) }
                });

                const { data: { text } } = await worker.recognize(file);
                await worker.terminate();

                const lines = text.split('\n');
                let currentCia = "INÍCIO DA ESCALA / GERAL";
                const organizedData = {};

                lines.forEach(line => {
                    const trimmed = line.trim();
                    if (!trimmed) return;

                    // Detecta Companhia e mantém a ordem
                    const ciaMatch = trimmed.match(/(\d+)\s?(ª|°|a|o)\s?CIA/i);
                    if (ciaMatch) {
                        currentCia = ciaMatch[0].toUpperCase();
                    }

                    if (!organizedData[currentCia]) organizedData[currentCia] = [];
                    
                    // Filtra apenas linhas que pareçam dados de escala (Vtr, Cidades, Nomes)[cite: 1]
                    if (trimmed.length > 5 && !trimmed.includes("PÁGINA")) {
                        organizedData[currentCia].push(trimmed);
                    }
                });

                const newEntry = {
                    id: Date.now(),
                    date: new Date().toLocaleString('pt-BR'),
                    companies: organizedData
                };

                const updated = [newEntry, ...schedules];
                setSchedules(updated);
                localStorage.setItem('ciops_data_final', JSON.stringify(updated));
                setLoading(false);
            };

            return (
                <div class="p-6 max-w-7xl mx-auto">
                    <header class="flex justify-between items-end border-b border-slate-800 pb-6 mb-8">
                        <div>
                            <h1 class="text-4xl font-black text-sky-500">CIOPS MONITOR</h1>
                            <p class="text-slate-500">Agrupamento por CIA • Processamento 100% Local</p>
                        </div>
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                            <input type="file" onChange={handleFileUpload} disabled={loading} class="text-sm file:bg-sky-600 file:text-white file:border-0 file:px-4 file:py-2 file:rounded-lg cursor-pointer"/>
                        </div>
                    </header>

                    {loading && (
                        <div class="mb-10 p-10 bg-slate-900 rounded-2xl border border-sky-500/30 text-center">
                            <div class="text-2xl font-bold text-sky-400 mb-4">Lendo Escala... {progress}%</div>
                            <div class="w-full bg-slate-800 h-4 rounded-full overflow-hidden">
                                <div class="bg-sky-500 h-full transition-all" style={{width: `${progress}%`}}></div>
                            </div>
                        </div>
                    )}

                    <div class="space-y-12">
                        {schedules.map(s => (
                            <div key={s.id} class="animate-in fade-in duration-700">
                                <h2 class="text-xl font-bold text-slate-400 mb-6 flex items-center gap-3">
                                    <span class="w-3 h-3 bg-sky-500 rounded-full"></span> Escala Importada em {s.date}
                                </h2>
                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {Object.entries(s.companies).map(([cia, items]) => (
                                        <div key={cia} class="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden shadow-xl">
                                            <div class="bg-slate-800 px-4 py-3 border-b border-slate-700 font-black text-sky-400">
                                                {cia}
                                            </div>
                                            <div class="p-4 space-y-2">
                                                {items.map((item, idx) => (
                                                    <div key={idx} class="text-sm text-slate-300 pb-2 border-b border-slate-800/50 last:border-0">
                                                        {item}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
